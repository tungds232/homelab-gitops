apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-hello-1
  namespace: demo-hello-1
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - demo-hello-1.tungds232.com
      secretName: tungds232-wildcard-tls
  rules:
    - host: demo-hello-1.tungds232.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-hello-1
                port:
                  number: 80
