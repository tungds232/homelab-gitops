apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-hello-1
  namespace: demo-hello-1
  labels:
    app: demo-hello-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-hello-1
  template:
    metadata:
      labels:
        app: demo-hello-1
    spec:
      priorityClassName: low-priority-noncritical
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: demo-hello-1-html
